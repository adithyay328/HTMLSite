[project]
name = "AdiHTML"
version = "0.1.0"
dependencies = [
    "aiobotocore>=3.1.3",
    "flask>=3.1.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pillow>=12.1.1",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
]

[tool.poetry]
name = "adihtml"
version = "0.1.0"
description = "A little library to build websites in Python, simply."
authors = ["Adithya Yerramsetty <adithyay@hotmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
